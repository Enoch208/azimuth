name: keeper

on:
  schedule:
    # open yesterday's map shortly after midnight UTC
    - cron: "5 0 * * *"
  workflow_dispatch:

jobs:
  reveal:
    runs-on: ubuntu-latest
    steps:
      # revealDay runs once; the trails are re-sent on every sweep, and each one
      # spends the contract's Inco fee float again. So this retries only while
      # the endpoint is still reporting failures, and stops the moment a sweep
      # comes back clean.
      - name: Open yesterday's map
        run: |
          for attempt in 1 2 3; do
            echo "sweep $attempt"
            if curl -sS --fail-with-body \
                 -H "authorization: Bearer ${{ secrets.KEEPER_SECRET }}" \
                 "${{ vars.REVEAL_URL }}"; then
              echo
              echo "every trail opened"
              exit 0
            fi
            echo
            sleep 45
          done
          echo "trails still sealed after three sweeps"
          exit 1
