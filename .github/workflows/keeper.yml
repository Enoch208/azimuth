name: keeper

on:
  schedule:
    # sweep expired vaults through the day
    - cron: "*/30 * * * *"
    # open yesterday's map shortly after midnight UTC
    - cron: "5 0 * * *"
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Respawn expired vaults
        run: |
          curl -sS --fail-with-body \
            -H "authorization: Bearer ${{ secrets.KEEPER_SECRET }}" \
            "${{ vars.KEEPER_URL }}"

      - name: Open yesterday's map
        run: |
          curl -sS --fail-with-body \
            -H "authorization: Bearer ${{ secrets.KEEPER_SECRET }}" \
            "${{ vars.REVEAL_URL }}"
